name: Multiple Booking regression
on:
  push:
    branches: [feat/multiple-booking-atomic-batch-v1-38]
  pull_request:
    branches: [main]
    paths:
      - "*.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "tests/**"
      - ".github/workflows/multiple-booking-tests.yml"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every JavaScript file
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run all node tests (Multiple Booking, Mawaqit, profile render)
        run: node --test tests/*.test.js
      - name: Install Playwright (Chromium) for the browser smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test (six tabs, Reports views, main dialogs)
        run: node tests/browser/smoke.mjs
      - name: Browser flow test (student, booking, payment, litres, backup restore, CSV)
        run: node tests/browser/flows.mjs
