name: Multiple Booking regression
on:
  push:
    branches: [feat/multiple-booking-atomic-batch-v1-38]
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "tests/**"
      - ".github/workflows/multiple-booking-tests.yml"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every JavaScript file
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run Multiple Booking atomic-save tests
        run: node --test tests/multiple-booking.test.js
